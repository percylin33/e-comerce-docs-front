  <!-- Script para detectar y prevenir bucles infinitos de recarga -->
  <script defer>
  // Sistema de diagnóstico simple y no invasivo
  (function() {
    var MAX_RECORDS = 5;
    var STORAGE_KEY = 'simple_reload_diagnostics';
    
    function getDiagnostics() {
      try {
        var stored = localStorage.getItem(STORAGE_KEY);
        return stored ? JSON.parse(stored) : { reloads: [] };
      } catch (e) {
        return { reloads: [] };
      }
    }
    
    function saveDiagnostics(diagnostics) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(diagnostics));
      } catch (e) {
        console.warn('Could not save diagnostics:', e);
      }
    }
    
    function recordReload() {
      var diagnostics = getDiagnostics();
      var record = {
        timestamp: Date.now(),
        url: window.location.href
      };
      
      diagnostics.reloads.unshift(record);
      if (diagnostics.reloads.length > MAX_RECORDS) {
        diagnostics.reloads = diagnostics.reloads.slice(0, MAX_RECORDS);
      }
      
      saveDiagnostics(diagnostics);
      
      // Solo detectar recargas muy rápidas (menos de 2 segundos)
      var now = Date.now();
      var recentReloads = diagnostics.reloads.filter(function(r) {
        return now - r.timestamp < 2000;
      });
      
      // Solo intervenir si hay más de 3 recargas en 2 segundos
      if (recentReloads.length > 3) {
        console.warn('🚨 Recargas muy rápidas detectadas - Limpiando storage');
        
        // Solo limpiar keys específicos y problemáticos
        var problematicKeys = [
          'forcedLogout', 'forcedLogoutTime', 'emergency_mode',
          'visits_disabled', 'visit_backend_error'
        ];
        
        problematicKeys.forEach(function(key) {
          try {
            localStorage.removeItem(key);
          } catch (e) {
            console.warn('Could not remove key:', key, e);
          }
        });
        
        // No recargar automáticamente - dejar que Angular maneje
      }
    }
    
    // Funciones de debug simplificadas
    window.getSimpleReloadDiagnostics = function() {
      return getDiagnostics();
    };
    
    window.clearSimpleReloadDiagnostics = function() {
      try {
        localStorage.removeItem(STORAGE_KEY);
        console.log('✅ Simple diagnostics cleared');
      } catch (e) {
        console.warn('Could not clear simple diagnostics:', e);
      }
    };
    
    // Registrar recarga
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', recordReload);
    } else {
      recordReload();
    }
    
  })();
  </script>
