<!-- Contenedor principal -->
<div class="container">
  <button class="chart-toggle-btn"
    (click)="toggleChartSidebar()"
    nbPopover="Ver análisis de ventas mensuales"
    nbPopoverTrigger="hint"
    nbPopoverPlacement="left">
    <nb-icon icon="bar-chart-2-outline"></nb-icon>
  </button>

  <!-- Barra de búsqueda y filtros -->
  <div class="filters-bar">
    <div class="search-wrapper">
      <nb-icon class="search-icon" icon="search-outline"></nb-icon>
      <input
        class="search-input"
        type="text"
        placeholder="Buscar por nombre o email..."
        [value]="searchTerm"
        (input)="onSearchInput($any($event.target).value)" />
        @if (searchTerm) {
          <button class="clear-btn" (click)="clearSearch()" title="Limpiar búsqueda">
            <nb-icon icon="close-outline"></nb-icon>
          </button>
        }
      </div>

      <!-- <div class="status-chips">
      <button
        *ngFor="let opt of statusOptions"
        class="chip"
        [class.chip--active]="currentStatus === opt.value"
        (click)="onStatusChange(opt.value)">
        {{ opt.label }}
      </button>
    </div> -->
  </div>

  <div class="table-container" [nbSpinner]="loading" nbSpinnerSize="giant" nbSpinnerStatus="primary">
    @if (paymentsList && paymentsList.length > 0) {
      <ngx-payments-table
        [payments]="paymentsList"
        (detailsClick)="showPaymentDetails($event)">
      </ngx-payments-table>
    }

    @if (!loading && (!paymentsList || paymentsList.length === 0)) {
      <div class="no-data-message">
        <p>No hay pagos para mostrar.</p>
      </div>
    }
  </div>

  <div class="paginator-container">
    <mat-paginator
      [length]="totalItems"
      [pageSizeOptions]="[6, 12, 24]"
      showFirstLastButtons
      (page)="onPageChange($event)">
    </mat-paginator>
  </div>
</div>

<!-- Sidebar separado del contenedor principal -->
<nb-sidebar
  tag="chart-sidebar"
  class="chart-sidebar"
  [state]="chartSidebarState"
  right
  fixed
  overlay
  [responsive]="false"
  [containerFixed]="false">
  <div class="sidebar-header">
    <h3>Análisis de Ventas</h3>
    <button class="close-btn" (click)="toggleChartSidebar()">
      <nb-icon icon="close-outline"></nb-icon>
    </button>
  </div>
  <div class="sidebar-content">
    <ngx-dynamic-chart
      [title]="'Ventas por Mes'"
      [data]="monthlyChartData"
      [labels]="monthlyChartLabels">
    </ngx-dynamic-chart>
  </div>
</nb-sidebar>
