<div class="user-container">
  <h1>Usuarios</h1>

  <div class="search-create-container">
    <!-- Campo de búsqueda -->
    <mat-form-field appearance="outline" class="search">
      <mat-label>Buscar Usuarios...</mat-label>
      <input matInput placeholder="Buscar Usuarios" (input)="onSearch($event)">
      @if (isLoading) {
        <mat-spinner diameter="20"></mat-spinner>
      }
    </mat-form-field>
    <!-- Botones de acción -->
    <div class="buttons-container">
      <button mat-raised-button [disabled]="!enableDelete" (click)="onDeleteClick()" color="warn" class="clear-search">
        <mat-icon>clear</mat-icon>
        Borrar
      </button>
      @if (isSupAdmin) {
        <button mat-raised-button [disabled]="!enableChangeRole" (click)="onChangeRoleClick()" color="primary" class="change-role">
          <mat-icon>manage_accounts</mat-icon>
          Cambiar Rol
        </button>
      }
    </div>
  </div>


  @if (user) {
    <ngx-custom-table
      [padre]="padre"
      [structTable]="structTable"
      [content]="user"
      [currentUser]="currentUser"
      (checkboxChange)="onCheckboxChangeInChild($event)"
      (sortChange)="onSortChange($event)">
    </ngx-custom-table>
  }

  <div class="paginator-container">
    <mat-paginator [length]="totalItems" [pageSizeOptions]="[6, 12, 24]" showFirstLastButtons (page)="onPageChange($event)"></mat-paginator>
  </div>

</div>
