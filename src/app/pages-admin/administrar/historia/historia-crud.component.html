<div class="historia-crud-container">
  @if (mensaje) {
    <div class="mensaje-confirmacion">
      {{ mensaje }}
    </div>
  }
  <h2>Gestión de Historia</h2>

  <!-- Botón para mostrar formulario -->
  <button class="btn-agregar" (click)="mostrarFormulario = !mostrarFormulario">
    <span class="material-icons">add_circle</span> Nuevo
  </button>

  <!-- Formulario para agregar nueva historia -->
  @if (mostrarFormulario) {
    <form (ngSubmit)="guardarNuevo()" #nuevoForm="ngForm" class="historia-form card">
      <div class="form-row">
        <input type="text" [(ngModel)]="nuevoHistoria.year" name="year" placeholder="Año" required />
        <input type="text" [(ngModel)]="nuevoHistoria.img" name="img" placeholder="URL Imagen" />
      </div>
      <div class="form-row">
        <input type="text" [(ngModel)]="nuevoHistoria.title" name="title" placeholder="Título" />
        <input type="text" [(ngModel)]="nuevoHistoria.text" name="text" placeholder="Descripción" />
        <button type="submit" class="btn-agregar"><span class="material-icons">check_circle</span> Guardar</button>
      </div>
    </form>
  }

  <!-- Tabla de historias -->
  <div class="table-responsive">
    <table class="historia-table">
      <thead>
        <tr>
          <th>Año</th>
          <th>Imagen</th>
          <th>Título</th>
          <th>Descripción</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (historia of historias; track historia) {
          <tr>
            @if (isEditing && editHistoria?.id === historia.id) {
              <td><input [(ngModel)]="editHistoria.year" name="editYear" /></td>
              <td><input [(ngModel)]="editHistoria.img" name="editImg" /></td>
              <td><input [(ngModel)]="editHistoria.title" name="editTitle" /></td>
              <td><input [(ngModel)]="editHistoria.text" name="editText" /></td>
              <td>
                <button (click)="guardarEdicion()" class="btn-guardar"><span class="material-icons">save</span></button>
                <button (click)="cancelarEdicion()" class="btn-cancelar"><span class="material-icons">cancel</span></button>
              </td>
            } @else {
              <td>{{ historia.year }}</td>
              <td><img [src]="historia.img" alt="img" class="historia-img" /></td>
              <td>{{ historia.title }}</td>
              <td>{{ historia.text }}</td>
              <td>
                <button (click)="editarHistoria(historia)" class="btn-editar"><span class="material-icons">edit</span></button>
                <button (click)="eliminarHistoria(historia.id)" class="btn-eliminar"><span class="material-icons">delete</span></button>
              </td>
            }
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
