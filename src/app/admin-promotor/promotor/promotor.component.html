<nb-card class="main-panel-card">
  <nb-card-header>
    <!-- Tres tarjetas pequeñas con la información -->
    <div class="stats-cards">
      <nb-card class="stat-card">
        <nb-card-header>Total Recaudado </nb-card-header>
        <nb-card-body>
          {{ totalRecaudado | currency:'PEN':'symbol':'1.2-2'}}
        </nb-card-body>
      </nb-card>

      <nb-card class="stat-card">
        <nb-card-header>Total por cobrar</nb-card-header>
        <nb-card-body>
          {{ totalPorCobrar | currency:'PEN':'symbol':'1.2-2'}}
        </nb-card-body>
      </nb-card>

      <nb-card class="stat-card">
        <nb-card-header>Ventas Realizadas</nb-card-header>
        <nb-card-body>
          {{ ventas }}
        </nb-card-body>
      </nb-card>

    </div>
  </nb-card-header>

  <nb-card-body>
    <div class="graficos">
      <div class="grafico">
        <div class="sidebar-header">
          <h3>Documentos más vendidos</h3>
        </div>
        <div class="sidebar-content">
          <apx-chart
            [series]="[{ data: documentChartData }]"
            [chart]="{ type: 'bar', height: 350 }"
            [xaxis]="{ categories: documentChartLabels }"
            [title]="{ text: 'Top Documentos por Ventas', align: 'center', style: { fontSize: '16px', color: '#333' } }"
            [plotOptions]="{ bar: { borderRadius: 4, horizontal: false } }"
            [dataLabels]="{ enabled: true }"
            [tooltip]="{ enabled: true }"
            [grid]="{ row: { colors: ['#f3f3f3', 'transparent'], opacity: 0.5 } }"
          ></apx-chart>
        </div>
      </div>
      <div class="grafico">
        <div class="sidebar-header">
          <h3>Análisis de Ventas</h3>
        </div>
        <div class="sidebar-content">
          <apx-chart
            [series]="[{ data: monthlyChartData }]"
            [chart]="{ type: 'bar', height: 350 }"
            [xaxis]="{ categories: monthlyChartLabels }"
            [title]="{ text: 'Ventas por Mes', align: 'center', style: { fontSize: '16px', color: '#333' } }"
            [plotOptions]="{ bar: { borderRadius: 4, horizontal: false } }"
            [dataLabels]="{ enabled: true }"
            [tooltip]="{ enabled: true }"
            [grid]="{ row: { colors: ['#f3f3f3', 'transparent'], opacity: 0.5 } }"
          ></apx-chart>
        </div>
      </div>
    </div>

    <!-- Sección detallada de explicación -->

  </nb-card-body>
</nb-card>
