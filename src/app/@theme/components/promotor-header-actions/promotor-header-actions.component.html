<div class="header-actions">
  <!-- Componente de notificaciones dinámico con polling -->
  <ngx-notification-bell></ngx-notification-bell>

  <div class="promotor-profile-dropdown">
    <button class="profile-btn" (click)="toggleProfileMenu($event)">
      <div class="avatar-small">{{ userInitials }}</div>
      <span>{{ userName }}</span>
      <i class="fas fa-chevron-down"></i>
    </button>

    <div class="dropdown-menu" [class.show]="showProfileMenu">
      <a routerLink="/promotor/perfil"><i class="fas fa-user-circle"></i><span>Mi Perfil</span></a>
  <a routerLink="/promotor/retiros"><i class="fas fa-money-bill-wave"></i><span>Solicitar Retiro</span></a>
      <a href="#" class="logout" (click)="onLogoutClick($event)"><i class="fas fa-sign-out-alt"></i><span>Cerrar Sesión</span></a>
    </div>
  </div>
</div>
