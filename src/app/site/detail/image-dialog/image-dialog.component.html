<div class="image-dialog" [class.image-dialog--pdf]="isPdf">
  <button type="button" class="close-btn" (click)="closeDialog()" aria-label="Cerrar">&times;</button>

  <!-- Modo PDF -->
  @if (isPdf) {
    <div class="pdf-container">
      @defer (on immediate) {
        <app-pdf-viewer-lazy
          [src]="data.pdfUrl"
          height="100%"
          (loaded)="onPdfLoaded()"
          (loadError)="onPdfError($event)">
        </app-pdf-viewer-lazy>
      } @placeholder {
        <div class="pdf-loading-overlay" aria-live="polite">
          <div class="pdf-spinner" aria-hidden="true"></div>
          <p class="pdf-loading-text">Cargando visor…</p>
        </div>
      }
      <div class="watermark">Carpeta-Digital</div>
      <!-- Overlay de carga -->
      @if (pdfLoading && !pdfError) {
        <div class="pdf-loading-overlay" aria-live="polite">
          <div class="pdf-spinner" aria-hidden="true"></div>
          <p class="pdf-loading-text">Cargando vista previa…</p>
        </div>
      }
      <!-- Mensaje de error -->
      @if (pdfError) {
        <div class="pdf-loading-overlay pdf-loading-overlay--error">
          <p>⚠️ No se pudo cargar la vista previa.</p>
        </div>
      }
    </div>
  }

  <!-- Modo imagen -->
  @if (!isPdf) {
    <div class="image-container">
      <img [src]="data.imageUrl" alt="Document Image" (click)="closeDialog()">
      <div class="watermark">Carpeta-Digital</div>
    </div>
  }
</div>
