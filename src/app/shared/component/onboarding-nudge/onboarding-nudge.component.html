<!-- ======================================================================= -->
<!-- ONBOARDING NUDGE COMPONENT TEMPLATE -->
<!-- Contextual help notification for new users -->
<!-- ======================================================================= -->

@if (isVisible && !isDismissed) {
  <div
    class="onboarding-nudge"
    [class.onboarding-nudge--visible]="isVisible"
    [class.onboarding-nudge--hiding]="!isVisible && isAnimating"
    role="dialog"
    aria-modal="false"
    aria-labelledby="onboarding-nudge-title"
    aria-describedby="onboarding-nudge-description"
  >
    <!-- Backdrop (click to dismiss) -->
    <div
      class="onboarding-nudge__backdrop"
      (click)="onDismiss($event)"
      aria-hidden="true"
    ></div>

    <!-- Main Card Container -->
    <div class="onboarding-nudge__card">
      <!-- Decorative gradient accent -->
      <div class="onboarding-nudge__accent" aria-hidden="true"></div>

      <!-- Close Button -->
      <button
        type="button"
        class="onboarding-nudge__close"
        (click)="onDismiss($event)"
        aria-label="Cerrar mensaje de ayuda"
        title="No mostrar de nuevo"
      >
        <mat-icon>close</mat-icon>
      </button>

      <!-- Content Wrapper -->
      <div class="onboarding-nudge__content">
        <!-- Icon Section -->
        <div class="onboarding-nudge__icon-wrapper">
          <div class="onboarding-nudge__icon">
            <mat-icon>lightbulb</mat-icon>
          </div>
          <div class="onboarding-nudge__pulse" aria-hidden="true"></div>
        </div>

        <!-- Text Content -->
        <div class="onboarding-nudge__text">
          <h3 id="onboarding-nudge-title" class="onboarding-nudge__title">
            ¿Necesitas ayuda para empezar?
          </h3>
          <p id="onboarding-nudge__description" class="onboarding-nudge__description">
            Descubre cómo aprovechar al máximo nuestra plataforma con nuestros tutoriales guiados.
          </p>
        </div>

        <!-- Action Buttons -->
        <div class="onboarding-nudge__actions">
          <button
            type="button"
            nbButton
            status="primary"
            size="small"
            class="onboarding-nudge__cta-primary"
            (click)="onPrimaryAction()"
          >
            <mat-icon>play_circle</mat-icon>
            <span>Ver tutoriales</span>
          </button>

          <button
            type="button"
            nbButton
            ghost
            size="small"
            class="onboarding-nudge__cta-secondary"
            (click)="onSecondaryAction()"
          >
            <mat-icon>support_agent</mat-icon>
            <span>Contactar soporte</span>
          </button>
        </div>
      </div>

      <!-- Progress indicator (auto-dismiss optional) -->
      <div class="onboarding-nudge__progress" aria-hidden="true">
        <div class="onboarding-nudge__progress-bar"></div>
      </div>
    </div>
  </div>
}
