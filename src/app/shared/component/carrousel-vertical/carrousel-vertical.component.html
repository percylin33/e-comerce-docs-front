<!-- MOVED TO .trash/DELETE_CARROUSEL_COMPONENTS.txt -->

  <button nbButton status="primary" size="small" (click)="retryLoad()">
    <nb-icon icon="refresh-outline"></nb-icon>
    Reintentar
  </button>


  <!-- Lista de documentos -->
  @if (!isLoading && !hasError && listDocuments?.length > 0) {
    <div class="documents-wrapper" [class.horizontal-scroll]="isHorizontalLayout">
      @for (document of listDocuments; track trackByDocument($index, document)) {
        <div class="document-item" [class.horizontal-item]="isHorizontalLayout">
          <ngx-document-card [document]="document"></ngx-document-card>
        </div>
      }
    </div>
  }

  <!-- Estado vacío -->
  @if (!isLoading && !hasError && (!listDocuments || listDocuments.length === 0)) {
    <div class="empty-state">
      <div class="empty-icon">
        <nb-icon icon="file-text-outline" status="basic"></nb-icon>
      </div>
      <p class="empty-message">No hay documentos disponibles en esta categoría.</p>
    </div>
  }
