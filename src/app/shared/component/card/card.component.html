<div class="card-container">
  <article class="card" [class.free-document]="item.documentoLibre">
    <!-- Badge para documentos gratuitos -->
    <div class="badge-container" *ngIf="item.documentoLibre">
      <span class="free-badge">
        <nb-icon icon="gift-outline"></nb-icon>
        GRATIS
      </span>
    </div>

    <!-- Badges de descuentos dinámicos -->
    <div class="discount-badges" *ngIf="!item.documentoLibre && hasAvailableDiscounts()">
      <!-- Badge para descuentos por situación (PLANIFICACION, EVALUACION, ESTRATEGIAS) -->
      <span class="discount-badge situation-discount" 
            *ngIf="(item.category === 'PLANIFICACION' || item.category === 'EVALUACION' || item.category === 'ESTRATEGIAS') && item.situacion">
        <nb-icon icon="people-outline"></nb-icon>
        {{getMultiItemDiscount()}}% OFF
        <span class="discount-detail">misma situación</span>
      </span>
      
      <!-- Badge para descuentos por reforzamiento -->
      <span class="discount-badge reforzamiento-discount" 
            *ngIf="item.category === 'REFORZAMIENTO' && item.materia">
        <nb-icon icon="book-outline"></nb-icon>
        {{getMultiItemDiscount()}}% OFF
        <span class="discount-detail">misma materia</span>
      </span>
      
      <!-- Badge para descuentos por plan lector -->
      <span class="discount-badge planlector-discount" 
            *ngIf="item.category === 'PLAN_LECTOR' && item.nivel">
        <nb-icon icon="award-outline"></nb-icon>
        {{getMultiItemDiscount()}}% OFF
        <span class="discount-detail">mismo nivel</span>
      </span>
      
      <!-- Badge de combo progresivo -->
      <span class="discount-badge combo-discount" *ngIf="hasComboDiscount()">
        <nb-icon icon="layers-outline"></nb-icon>
        COMBO
        <span class="discount-detail">hasta 40%</span>
      </span>
    </div>
    
    <!-- Contenedor de imagen con overlay de acciones -->
    <div class="card-image-container" (click)="goDetails()">
      <img 
        class="card-image" 
        [src]="item.imagenUrlPublic" 
        [alt]="'Imagen de ' + item.title"
        loading="lazy"
      />
      <div class="image-overlay">
        <button class="view-details-btn" aria-label="Ver detalles">
          <nb-icon icon="eye-outline"></nb-icon>
          Ver detalles
        </button>
      </div>
    </div>

    <!-- Contenido principal -->
    <div class="card-content" (click)="goDetails()">
      <h3 class="card-title" 
          [title]="item.title">
        {{item.title}}
      </h3>
      <p class="card-description" 
         [title]="item.description">
        {{item.description}}
      </p>
      
      <!-- Información de precios con descuentos -->
      <div class="price-info" *ngIf="!item.documentoLibre && item.price">
        <div class="pricing-section">
          <span class="current-price">
            <nb-icon icon="pricetags-outline"></nb-icon>
            {{item.price | currency:'PEN':'symbol':'1.2-2'}}
          </span>
          
          <!-- Mostrar precio con descuento si aplica -->
          <!-- <div class="discount-preview" *ngIf="getMultiItemDiscount() > 0">
            <span class="original-price">{{item.price | currency:'PEN':'symbol':'1.2-2'}}</span>
            <span class="discounted-price">
              {{getDiscountedPrice() | currency:'PEN':'symbol':'1.2-2'}}
            </span>
            <span class="savings-text">¡Ahorra {{getSavingsAmount() | currency:'PEN':'symbol':'1.2-2'}}!</span>
          </div> -->
        </div>
        
        <!-- Incentivo de compra múltiple -->
        <!-- <div class="purchase-incentive" *ngIf="getMultiItemDiscount() > 0 && !item.documentoLibre">
          <nb-icon icon="gift-outline"></nb-icon>
          <span>Compra 2+ y ahorra {{getMultiItemDiscount()}}%</span>
        </div> -->
      </div>
    </div>

    <!-- Footer con acciones -->
    <footer class="card-footer">
      <button 
        class="action-btn like-btn" 
        (click)="likeDocument($event)"
        [class.liked]="isLiked"
        aria-label="Me gusta"
        title="Me gusta">
        <nb-icon [icon]="isLiked ? 'heart' : 'heart-outline'"></nb-icon>
        <span class="btn-text">{{item.countLikes || 0}}</span>
      </button>

      <button 
        *ngIf="!item.documentoLibre" 
        class="action-btn cart-btn"
        (click)="addToCart($event)"
        aria-label="Agregar al carrito"
        title="Agregar al carrito">
        <nb-icon icon="shopping-cart-outline"></nb-icon>
        <span class="btn-text">Carrito</span>
      </button>

      <button 
        *ngIf="item.documentoLibre" 
        class="action-btn download-btn"
        (click)="goDetails($event)"
        aria-label="Descargar gratis"
        title="Descargar gratis">
        <nb-icon icon="download-outline"></nb-icon>
        <span class="btn-text">Descargar</span>
      </button>
    </footer>
  </article>
</div>
