<div class="dialog-container"
  [class.small-height]="isSmallHeight"
  [class.very-small-height]="isVerySmallHeight"
  role="dialog"
  aria-labelledby="dialog-title"
  aria-describedby="dialog-description">

  <button
    class="close-button-top"
    (click)="closeModal()"
    aria-label="Cerrar modal"
    type="button">
    ×
  </button>

  <h2 id="dialog-title" class="dialog-header">
    @if (!isVerySmallHeight && !isSmallWidth) {
      <span>Accede para continuar con tu compra</span>
    }
    @if (isVerySmallHeight || isSmallWidth) {
      <span>Accede para continuar</span>
    }
  </h2>

  <p id="dialog-description" class="dialog-intro">
    Tu selección se mantiene en esta página. Inicia sesión o regístrate aquí sin salir del pedido.
  </p>

  <div class="auth-panel-tabs" role="tablist" aria-label="Tipo de acceso">
    <button
      type="button"
      class="auth-tab"
      [class.active]="authPanel === 'login'"
      (click)="showLoginPanel()"
      role="tab"
      [attr.aria-selected]="authPanel === 'login'">
      Iniciar sesión
    </button>
    <button
      type="button"
      class="auth-tab"
      [class.active]="authPanel === 'register'"
      (click)="showRegisterPanel()"
      role="tab"
      [attr.aria-selected]="authPanel === 'register'">
      Crear cuenta
    </button>
  </div>

  <div class="auth-embed-wrap">
    @if (authPanel === 'login') {
      <ngx-login
        embedded
        (switchToRegister)="showRegisterPanel()" />
    } @else {
      <ngx-register
        embedded
        (switchToLogin)="showLoginPanel()" />
    }
  </div>
</div>
