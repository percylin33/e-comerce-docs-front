<div class="chart-wrapper">
  <h3 class="chart-title">{{title}}</h3>
  <apx-chart
    [series]="safeChartOptions.series"
    [chart]="safeChartOptions.chart"
    [xaxis]="safeChartOptions.xaxis"
    [yaxis]="safeChartOptions.yaxis"
    [title]="safeChartOptions.title"
    [plotOptions]="safeChartOptions.plotOptions"
    [dataLabels]="safeChartOptions.dataLabels"
    [tooltip]="safeChartOptions.tooltip"
    [grid]="safeChartOptions.grid"
  ></apx-chart>
</div>
