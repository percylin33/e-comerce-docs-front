<nb-card class="chart-card">
  <nb-card-header>
    <h6>Ventas por Grado</h6>
    <div class="chart-controls">
      <button 
        *ngIf="!isLoading && hasData" 
        nbButton 
        size="small" 
        status="primary" 
        outline
        (click)="toggleSortBy()"
        class="toggle-btn">
        <nb-icon [icon]="getSortButtonIcon()"></nb-icon>
        {{ getSortButtonText() }}
      </button>
      <nb-icon 
        *ngIf="isLoading" 
        icon="loader-outline" 
        class="loading-icon">
      </nb-icon>
    </div>
  </nb-card-header>
  
  <nb-card-body>
    <div class="chart-container">
      <div *ngIf="isLoading" class="loading-container">
        <nb-spinner size="medium"></nb-spinner>
        <p>Cargando datos...</p>
      </div>
      
      <div *ngIf="!isLoading && !hasData" class="no-data">
        <nb-icon icon="trending-up-outline"></nb-icon>
        <p>No hay datos disponibles para mostrar</p>
      </div>
      
      <apx-chart 
        *ngIf="!isLoading && hasData"
        [series]="chartOptions.series"
        [chart]="chartOptions.chart"
        [dataLabels]="chartOptions.dataLabels"
        [stroke]="chartOptions.stroke"
        [xaxis]="chartOptions.xaxis"
        [yaxis]="chartOptions.yaxis"
        [tooltip]="chartOptions.tooltip"
        [fill]="chartOptions.fill"
        [colors]="chartOptions.colors">
      </apx-chart>
    </div>
  </nb-card-body>
</nb-card>
