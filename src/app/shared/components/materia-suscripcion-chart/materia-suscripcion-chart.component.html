@if (data.length > 0) {
  <div>
    <button (click)="toggleSortBy()" style="margin-bottom: 12px; padding: 6px 16px; font-size: 13px; border-radius: 6px; border: 1px solid #3366FF; background: #fff; color: #3366FF; cursor: pointer;">
      {{ getSortButtonText() }}
    </button>
    <apx-chart
      [series]="chartOptions?.series || []"
      [chart]="chartOptions?.chart || {}"
      [xaxis]="chartOptions?.xaxis || {}"
      [plotOptions]="chartOptions.plotOptions"
      [title]="chartOptions.title">
    </apx-chart>
  </div>
}
