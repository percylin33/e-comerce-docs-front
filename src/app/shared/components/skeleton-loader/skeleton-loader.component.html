<div [ngSwitch]="type">
  <!-- Stats Grid Skeleton -->
  <div *ngSwitchCase="'stats'" class="skeleton-stats-grid">
    <div class="skeleton-stat-card" *ngFor="let item of items">
      <div class="skeleton-circle"></div>
      <div class="skeleton-content">
        <div class="skeleton-line short"></div>
        <div class="skeleton-line long"></div>
      </div>
    </div>
  </div>

  <!-- Card Skeleton -->
  <div *ngSwitchCase="'card'" class="skeleton-card">
    <div class="skeleton-card-header">
      <div class="skeleton-line medium"></div>
    </div>
    <div class="skeleton-card-body">
      <div class="skeleton-line full"></div>
      <div class="skeleton-line full"></div>
      <div class="skeleton-line medium"></div>
    </div>
  </div>

  <!-- Table Skeleton -->
  <div *ngSwitchCase="'table'" class="skeleton-table">
    <div class="skeleton-table-header">
      <div class="skeleton-line full"></div>
    </div>
    <div class="skeleton-table-row" *ngFor="let item of items">
      <div class="skeleton-line short"></div>
      <div class="skeleton-line medium"></div>
      <div class="skeleton-line long"></div>
    </div>
  </div>

  <!-- Chart Skeleton -->
  <div *ngSwitchCase="'chart'" class="skeleton-chart">
    <div class="skeleton-chart-bars">
      <div class="skeleton-bar" *ngFor="let item of items" [style.height.%]="50 + (item * 10)"></div>
    </div>
    <div class="skeleton-chart-legend">
      <div class="skeleton-line short"></div>
      <div class="skeleton-line short"></div>
      <div class="skeleton-line short"></div>
    </div>
  </div>
</div>
