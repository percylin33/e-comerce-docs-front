<nb-card class="chart-card">
  <nb-card-header>
    <h6>Ventas por Nivel Educativo</h6>
    <div class="chart-controls">
      <button 
        *ngIf="!isLoading && hasData" 
        nbButton 
        size="small" 
        status="primary" 
        outline
        (click)="toggleSortBy()"
        class="toggle-btn">
        <nb-icon [icon]="getSortButtonIcon()"></nb-icon>
        {{ getSortButtonText() }}
      </button>
      <nb-icon 
        *ngIf="isLoading" 
        icon="loader-outline" 
        class="loading-icon">
      </nb-icon>
    </div>
  </nb-card-header>
  
  <nb-card-body>
    <div class="chart-container">
      <div *ngIf="isLoading" class="loading-container">
        <nb-spinner size="medium"></nb-spinner>
        <p>Cargando datos...</p>
      </div>
      
      <div *ngIf="!isLoading && !hasData" class="no-data">
        <nb-icon icon="pie-chart-outline"></nb-icon>
        <p>No hay datos disponibles para mostrar</p>
      </div>
      
      <apx-chart 
        *ngIf="!isLoading && hasData"
        [series]="chartOptions?.series || []"
        [chart]="chartOptions?.chart || {}"
        [labels]="chartOptions?.labels || []"
        [dataLabels]="chartOptions?.dataLabels || {}"
        [responsive]="chartOptions?.responsive || []"
        [legend]="chartOptions?.legend || {}"
        [plotOptions]="chartOptions?.plotOptions || {}"
        [colors]="chartOptions?.colors || []">
      </apx-chart>
    </div>
  </nb-card-body>
</nb-card>
