<div class="notification-bell">
  <button class="bell-button" (click)="toggleDropdown()">
    <i class="fas fa-bell"></i>
    <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
  </button>

  <div class="notification-dropdown" *ngIf="showDropdown">
    <div class="dropdown-header">
      <h3>Notificaciones</h3>
      <button *ngIf="unreadCount > 0" (click)="markAllAsRead()" class="mark-all-btn">
        Marcar todas leídas
      </button>
    </div>

    <div class="notification-list" *ngIf="!loading">
      <div *ngIf="notifications.length === 0" class="empty-state">
        <i class="fas fa-bell-slash"></i>
        <p>No tienes notificaciones</p>
      </div>

      <div 
        *ngFor="let notification of notifications" 
        class="notification-item" 
        [class.unread]="!notification.isRead"
        [ngClass]="getNotificationClass(notification.type)"
        (click)="markAsRead(notification, $event)">
        
        <div class="notification-icon">
          <i [class]="getNotificationIcon(notification.type)"></i>
        </div>
        
        <div class="notification-content">
          <h4>{{ notification.title }}</h4>
          <p>{{ notification.message }}</p>
          <span class="time-ago">{{ notification.timeAgo }}</span>
        </div>
        
        <div class="notification-indicator" *ngIf="!notification.isRead"></div>
      </div>
    </div>

    <div class="loading-state" *ngIf="loading">
      <i class="fas fa-spinner fa-spin"></i>
      <p>Cargando notificaciones...</p>
    </div>
  </div>
</div>
