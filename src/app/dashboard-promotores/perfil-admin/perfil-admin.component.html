<div class="modal-overlay" (click)="onCloseModal()" style="background: rgba(255, 0, 0, 0.8) !important; z-index: 999999 !important;">
  <div class="modal-container" (click)="$event.stopPropagation()" style="background: white !important; border: 5px solid blue !important;">
    <div class="modal-header">
      <h2>Mi Cuenta</h2>
      <button class="close-btn" (click)="onCloseModal()">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="modal-body">
      <div class="profile-tabs">
        <button 
          [class.active]="activeTab === 'personal'" 
          (click)="setTab('personal')">
          <i class="fas fa-user"></i> Información Personal
        </button>
        <button 
          [class.active]="activeTab === 'pagos'" 
          (click)="setTab('pagos')">
          <i class="fas fa-credit-card"></i> Método de Pago
        </button>
        <button 
          [class.active]="activeTab === 'seguridad'" 
          (click)="setTab('seguridad')">
          <i class="fas fa-lock"></i> Seguridad
        </button>
      </div>

      <!-- Tab: Información Personal -->
      <div class="tab-content" *ngIf="activeTab === 'personal'">
        <form (ngSubmit)="onSubmitPersonal()">
          <div class="profile-photo-section">
            <div class="photo-preview">
              <img *ngIf="imagePreview" [src]="imagePreview" alt="Foto de perfil">
              <div *ngIf="!imagePreview" class="avatar-placeholder">{{ userInitials }}</div>
            </div>
            <div class="photo-actions">
              <label class="btn btn-primary btn-sm">
                <i class="fas fa-upload"></i> Subir Foto
                <input type="file" accept="image/*" (change)="onFileSelected($event)" style="display: none;">
              </label>
              <button type="button" class="btn btn-secondary btn-sm" (click)="removePhoto()" *ngIf="selectedFile">
                <i class="fas fa-trash"></i> Eliminar
              </button>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Nombre</label>
              <input type="text" class="form-control" [(ngModel)]="formPersonal.firstname" name="firstname" required>
            </div>
            <div class="form-group">
              <label>Apellido</label>
              <input type="text" class="form-control" [(ngModel)]="formPersonal.lastname" name="lastname" required>
            </div>
          </div>

          <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" class="form-control" [(ngModel)]="formPersonal.email" name="email" required>
          </div>

          <div class="form-group">
            <label>Teléfono</label>
            <input type="text" class="form-control" [(ngModel)]="formPersonal.phone" name="phone">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>DNI</label>
              <input type="text" class="form-control" [(ngModel)]="formPersonal.dni" name="dni">
            </div>
            <div class="form-group">
              <label>RUC (opcional)</label>
              <input type="text" class="form-control" [(ngModel)]="formPersonal.ruc" name="ruc">
            </div>
          </div>

          <button type="submit" class="btn btn-primary" [disabled]="loading">
            <i class="fas fa-save"></i> {{ loading ? 'Guardando...' : 'Guardar Cambios' }}
          </button>
        </form>
      </div>

      <!-- Tab: Método de Pago -->
      <div class="tab-content" *ngIf="activeTab === 'pagos'">
        <form (ngSubmit)="onSubmitPago()">
          <div class="form-group">
            <label>Banco</label>
            <input type="text" class="form-control" [(ngModel)]="formPago.banco" name="banco" required>
          </div>

          <div class="form-group">
            <label>Número de Cuenta</label>
            <input type="text" class="form-control" [(ngModel)]="formPago.cuenta" name="cuenta" required>
          </div>

          <div class="form-group">
            <label>Código Interbancario (CCI)</label>
            <input type="text" class="form-control" [(ngModel)]="formPago.cuentaCci" name="cuentaCci">
          </div>

          <button type="submit" class="btn btn-primary" [disabled]="loading">
            <i class="fas fa-save"></i> {{ loading ? 'Guardando...' : 'Guardar Método de Pago' }}
          </button>
        </form>
      </div>

      <!-- Tab: Seguridad -->
      <div class="tab-content" *ngIf="activeTab === 'seguridad'">
        <form (ngSubmit)="onSubmitSeguridad()">
          <div class="form-group">
            <label>Contraseña Actual</label>
            <input type="password" class="form-control" [(ngModel)]="formSeguridad.currentPassword" name="currentPassword" required>
          </div>

          <div class="form-group">
            <label>Nueva Contraseña</label>
            <input type="password" class="form-control" [(ngModel)]="formSeguridad.newPassword" name="newPassword" required>
          </div>

          <div class="form-group">
            <label>Confirmar Nueva Contraseña</label>
            <input type="password" class="form-control" [(ngModel)]="formSeguridad.confirmPassword" name="confirmPassword" required>
          </div>

          <button type="submit" class="btn btn-primary" [disabled]="loading">
            <i class="fas fa-key"></i> {{ loading ? 'Actualizando...' : 'Cambiar Contraseña' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
